name: backbone_env_v2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11  # here are problems with newer python versions.
  # Data manipulation
  - pandas
  - numpy
  - pyarrow
  # ML / NLP
  - scikit-learn
  - gensim 
  - umap-learn
  - sentence-transformers
  - transformers
  - sentencepiece
  - pytorch          # torch
  - bertopic         # maybe it is better to install it via pip, to avoid dependency issues.
  # Visualization
  - matplotlib
  - matplotlib-venn  # matplotlib_venn
  - seaborn
  - wordcloud
  - ipython
  - ipywidgets
  - venn
  # NLP utilities
  - nltk
  - spacy
  - langdetect
  - emoji
  # Graph / network
  - networkx
  # Utilities
  - tqdm
  - tabulate
  - ruptures
  - ipykernel
  - papermill
  # - pip:
  #   - bertopic



################ How to use? In terminal do: ################
# conda env create -y -f ./config/conda_requirements.yml
# conda activate backbone_env_v2
# python -m ipykernel install --user --name backbone_env_v2 --display-name "backbone_env_v2"
