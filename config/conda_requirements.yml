name: backbone_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11  # here are problems with newer python versions.
  # Data manipulation
  - pandas
  - numpy
  - pyarrow
  # ML / NLP
  - scikit-learn
  - gensim 
  - umap-learn
  - sentence-transformers
  - transformers
  - sentencepiece
  - pytorch          # torch
  - bertopic 
  # Visualization
  - matplotlib
  - matplotlib-venn  # matplotlib_venn
  - seaborn
  - wordcloud
  - ipython
  - ipywidgets
  - venn
  # NLP utilities
  - nltk
  - spacy
  - langdetect
  - emoji
  # Graph / network
  - networkx
  # Utilities
  - tqdm
  - tabulate
  - ruptures
